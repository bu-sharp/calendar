<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BU-SHARP Events Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   SETTINGS — the only part you need to edit.
   ===================================================================== */
window.CALENDAR_SETTINGS = {
  // Paste your Google Sheet "Publish to web" CSV link. Leave "" to preview with sample events.

  TIMEZONE_LABEL: "ET",            // shown after event times; "" to hide

  // BU-SHARP colors (from the logo)
  COLORS: {
    purple: "#39155A",             // side panel, headings, buttons
    teal:   "#14A3B7",             // accents
    // One color per topic. Names must match the Topic column (capitalization doesn't matter).

      "Research Accelerator Meetings": "#39155A",
      "Research Frontiers":            "#14A3B7",
      "Office Hours":                  "#2A4D7F",
      "Hackathons":                    "#A23E8C"
    },
    // Used for any other topic you add later
    extra: ["#0F8597", "#6B4C9A", "#3E6FA8"]
  }
};

<style>
  :root {
    --purple: #39155A;
    --teal: #14A3B7;
    --teal-strong: #0F8597;   /* darker teal for text and small marks, readable on white */
    --secondary: var(--purple);
    --primary: var(--teal-strong);
    --ink: #221A2E;
    --muted: #625B6E;
    --line: #E6E3EC;
    --soft: #F5F3F8;
    --paper: #FFFFFF;
    --radius-lg: 14px;
    --radius-sm: 7px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body {
    font-family: "Figtree", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 4px 4px 24px; }

  /* Topic filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  .filters:empty { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: var(--paper);
    border-radius: 999px; padding: 6px 14px; font-size: 0.86rem; font-weight: 500;
    transition: background .15s, border-color .15s;
  }
  .chip .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--secondary)); }
  .chip:hover { border-color: color-mix(in srgb, var(--c, var(--secondary)) 45%, white); }
  .chip[aria-pressed="true"] {
    background: color-mix(in srgb, var(--c, var(--secondary)) 12%, white);
    border-color: var(--c, var(--secondary)); color: var(--ink); font-weight: 600;
  }

  /* Two-column layout */
  .layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: stretch; }

  /* Sidebar: event list */
  .side {
    position: relative; min-height: 420px;
    background: var(--secondary); color: #fff;
    border-radius: var(--radius-lg); overflow: hidden;
  }
  .side { border-top: 5px solid var(--teal); }
  .side-head { padding: 20px 22px 14px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .brand img { width: 38px; height: 38px; border-radius: 50%; background: #fff; padding: 3px; }
  .brand span { font-weight: 700; font-size: 0.95rem; letter-spacing: 0.01em; }
  .side-kicker { font-size: 0.85rem; color: #9FDCE5; margin: 0 0 2px; font-weight: 500; }
  .side-title { font-size: 1.35rem; font-weight: 700; margin: 0; line-height: 1.2; }
  .side-reset {
    margin-top: 10px; background: rgba(255,255,255,.12); border: 0; color: #fff;
    border-radius: 999px; padding: 5px 12px; font-size: 0.82rem; font-weight: 500;
  }
  .side-reset:hover { background: rgba(255,255,255,.2); }
  .side-list {
    position: absolute; left: 0; right: 0; bottom: 0; top: var(--head-h, 90px);
    overflow-y: auto; padding: 4px 14px 16px; display: flex; flex-direction: column; gap: 10px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.35) transparent;
  }
  .card {
    display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: start;
    width: 100%; text-align: left; border: 0; background: var(--paper); color: var(--ink);
    border-radius: 10px; padding: 12px; transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  
  .cd {
    border-radius: 8px; text-align: center; padding: 6px 0 5px;
    background: color-mix(in srgb, var(--c) 13%, white); color: color-mix(in srgb, var(--c) 78%, black);
  }
  .cd .mo { font-size: 0.7rem; font-weight: 700; letter-spacing: .04em; }
  .cd .dn { font-size: 1.35rem; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .card-title { font-weight: 700; font-size: 0.95rem; line-height: 1.3; margin: 1px 0 3px; }
  .card-meta { font-size: 0.8rem; color: var(--muted); margin: 0; line-height: 1.4; }
  .card-topic { display: inline-block; margin-top: 6px; font-size: 0.74rem; font-weight: 700; color: color-mix(in srgb, var(--c) 78%, black); }
  .thumb { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; background: var(--soft); }
  .side::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 28px; pointer-events: none;
    background: linear-gradient(to bottom, transparent, var(--secondary));
  }
  .side-empty { color: rgba(255,255,255,.8); padding: 6px 8px; margin: 0; font-size: 0.92rem; }

  /* Calendar panel */
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px 18px 14px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .month-title { margin: 0; font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; color: var(--secondary); line-height: 1.1; }
  .month-title .y { font-weight: 500; color: var(--muted); }
  .nav { display: flex; gap: 6px; align-items: center; }
  .nav button {
    border: 1px solid var(--line); background: var(--paper);
    height: 38px; border-radius: 999px; padding: 0 14px; font-weight: 600; font-size: 0.88rem;
    transition: background .15s, border-color .15s;
  }
  .nav button:hover { background: var(--soft); }
  .nav .arrow { width: 38px; padding: 0; font-size: 1.15rem; line-height: 1; }
  .nav #today { background: var(--purple); border-color: var(--purple); color: #fff; }
  .nav #today:hover { background: color-mix(in srgb, var(--purple) 82%, white); }

  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .dow { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-align: center; padding: 2px 0 6px; }
  .day {
    min-height: 108px; padding: 6px; border-radius: var(--radius-sm);
    background: var(--soft); display: flex; flex-direction: column; gap: 3px; min-width: 0;
    border: 1px solid transparent; transition: border-color .15s, background .15s;
  }
  .day.out { background: transparent; }
  .day.out .num { color: #B7B1C0; }
  .day.has { cursor: pointer; }
  .day.has:hover { border-color: var(--line); background: #EEEAF3; }
  .day.sel, .day.sel:hover { border-color: var(--teal); background: var(--paper); box-shadow: inset 0 0 0 1px var(--teal); }
  .num {
    font-size: 0.84rem; font-weight: 600; font-variant-numeric: tabular-nums;
    width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%;
  }
  .day.today .num { background: var(--primary); color: #fff; }

  .ev {
    display: block; width: 100%; text-align: left; border: 0;
    background: color-mix(in srgb, var(--c) 14%, white); color: color-mix(in srgb, var(--c) 80%, black);
    border-radius: 5px; padding: 3px 6px; font-size: 0.76rem; font-weight: 600; line-height: 1.3;
    overflow-wrap: anywhere; transition: background .15s;
  }
  .ev .lc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ev:hover { background: color-mix(in srgb, var(--c) 24%, white); }
  .ev .t { font-weight: 500; opacity: .8; margin-right: 3px; font-variant-numeric: tabular-nums; }
  .more { background: none; border: 0; padding: 1px 6px; font-size: 0.74rem; font-weight: 600; color: var(--muted); text-align: left; }
  .dots { display: none; gap: 3px; justify-content: center; }
  .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

  .status { padding: 60px 0; color: var(--muted); text-align: center; }
  .status.error { color: #B3261E; }

  /* Event dialog */
  dialog {
    border: 0; padding: 0; width: min(560px, calc(100% - 24px)); max-height: calc(100% - 24px);
    border-radius: 16px; box-shadow: 0 24px 60px rgba(20,28,48,.3); color: var(--ink); overflow: auto;
  }
  dialog::backdrop { background: rgba(20,28,48,.5); }
  .dlg-band { height: 8px; background: var(--c); }
  .dlg-img { width: 100%; max-height: 300px; object-fit: cover; display: block; }
  .dlg-body { padding: 22px 26px 26px; }
  .dlg-topic {
    display: inline-block; font-size: 0.78rem; font-weight: 700; margin: 0 0 10px;
    padding: 3px 10px; border-radius: 999px;
    background: color-mix(in srgb, var(--c) 13%, white); color: color-mix(in srgb, var(--c) 80%, black);
  }
  .dlg-title { font-size: 1.5rem; font-weight: 800; line-height: 1.2; margin: 0 0 14px; color: var(--secondary); letter-spacing: -0.01em; }
  .facts { display: grid; gap: 8px; margin: 0 0 18px; padding: 14px 16px; background: var(--soft); border-radius: 10px; font-size: 0.92rem; }
  .fact { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
  .fact svg { width: 18px; height: 18px; margin-top: 2px; color: var(--muted); }
  .dlg-desc { white-space: pre-line; margin: 0 0 22px; }
  .dlg-desc a, .fact a { color: var(--primary); }
  .dlg-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-reg {
    background: var(--purple); color: #fff; text-decoration: none; font-weight: 700;
    padding: 11px 22px; border-radius: 999px;
  }
  .btn-reg:hover { background: color-mix(in srgb, var(--purple) 82%, white); }
  .btn-ghost { background: var(--paper); border: 1px solid var(--line); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; }
  .btn-ghost:hover { background: var(--soft); }
  .dlg-close {
    position: absolute; top: 16px; right: 14px; width: 34px; height: 34px;
    border: 0; border-radius: 50%; background: rgba(255,255,255,.94); font-size: 1.25rem; line-height: 1;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .panel { order: -1; }
    .side { min-height: 0; }
    .side-list { position: static; max-height: none; overflow: visible; }
    .side::after { display: none; }
  }
  @media (max-width: 600px) {
    .panel { padding: 14px 10px 10px; }
    .month-title { font-size: 1.4rem; }
    .grid { gap: 3px; }
    .day { min-height: 52px; padding: 4px 2px; align-items: center; }
    .ev, .more { display: none; }
    .dots { display: flex; }
    .nav #today { padding: 0 11px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (prefers-reduced-motion: no-preference) {
    dialog[open] { animation: rise .18s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  }
</style>
</head>

      <div class="cal-head">
        <h1 class="month-title" aria-live="polite"><span id="mName"></span> <span class="y" id="mYear"></span></h1>
        <div class="nav">
          <button class="arrow" id="prev" aria-label="Previous month">&#8249;</button>
          <button id="today">Today</button>
          <button class="arrow" id="next" aria-label="Next month">&#8250;</button>
        </div>
      </div>
      <div id="view"><p class="status">Loading events…</p></div>
    </section>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <button class="dlg-close" id="dlgClose" aria-label="Close">&times;</button>
  <div id="dlgContent"></div>
</dialog>

<script>
(function () {
  "use strict";
  var S = window.CALENDAR_SETTINGS;
  var C = S.COLORS || {};
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var DOW_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var TOPIC_COLORS = {};
  Object.keys(C.topics || {}).forEach(function (k) { TOPIC_COLORS[k.trim().toLowerCase()] = C.topics[k]; });
  var EXTRA = (C.extra && C.extra.length) ? C.extra : ["#0F8597", "#6B4C9A", "#3E6FA8"];
  if (C.purple) document.documentElement.style.setProperty("--purple", C.purple);
  if (C.teal) document.documentElement.style.setProperty("--teal", C.teal);

  var state = { year: 0, month: 0, events: [], topics: [], active: null, selected: null };
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- CSV parsing (handles quotes, commas, line breaks) ---------- */
  function parseCSV(text) {
    var rows = [], row = [], field = "", i = 0, q = false, c;
    text = text.replace(/^\uFEFF/, "");
    while (i < text.length) {
      c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += c;
      } else if (c === '"' && field === "") q = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
      i++;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  /* ---------- Column names: flexible matching ---------- */
  var COLS = {
    title: ["title", "event", "event title", "name"],
    date: ["date", "start date", "event date"],
    endDate: ["end date"],
    start: ["start time", "start", "time"],
    end: ["end time", "end"],
    topic: ["topic", "category", "type"],
    location: ["location", "where", "venue"],
    description: ["description", "details", "summary"],
    image: ["image url", "image", "graphic", "graphic url", "flyer", "picture"],
    link: ["registration link", "register link", "registration url", "registration", "register", "link", "rsvp"],
    show: ["show on calendar", "show", "publish", "published"]
  };
  function mapHeaders(header) {
    var norm = header.map(function (h) { return h.trim().toLowerCase().replace(/\s+/g, " "); });
    var map = {};
    Object.keys(COLS).forEach(function (k) {
      for (var j = 0; j < COLS[k].length; j++) {
        var idx = norm.indexOf(COLS[k][j]);
        if (idx > -1) { map[k] = idx; return; }
      }
    });
    return map;
  }

  /* ---------- Dates & times ---------- */
  function parseDate(s) {
    s = (s || "").trim();
    if (!s) return null;
    var m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1], +m[2] - 1, +m[3]);
    if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) {
      var y = +m[3]; if (y < 100) y += 2000;
      return new Date(y, +m[1] - 1, +m[2]);
    }
    var d = new Date(s.replace(/(\d)(st|nd|rd|th)\b/g, "$1"));
    return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function parseTime(s) {
    s = (s || "").trim().toLowerCase().replace(/\./g, "");
    if (!s) return null;
    var m = s.match(/^(\d{1,2})(?::(\d{2}))?(?::\d{2})?\s*(am|pm|a|p)?$/);
    if (!m) return null;
    var h = +m[1], min = +(m[2] || 0), ap = m[3];
    if (ap) { ap = ap[0]; if (ap === "p" && h < 12) h += 12; if (ap === "a" && h === 12) h = 0; }
    if (h > 23 || min > 59) return null;
    return h * 60 + min;
  }
  function fmtTime(mins, short) {
    var h = Math.floor(mins / 60), m = mins % 60, ap = h >= 12 ? "pm" : "am";
    h = h % 12 || 12;
    if (short) return h + (m ? ":" + String(m).padStart(2, "0") : "") + ap[0];
    return h + ":" + String(m).padStart(2, "0") + " " + ap.toUpperCase();
  }
  function timeRange(ev) {
    if (ev.start == null) return "";
    var tz = S.TIMEZONE_LABEL ? " " + S.TIMEZONE_LABEL : "";
    return fmtTime(ev.start) + (ev.end != null ? " – " + fmtTime(ev.end) : "") + tz;
  }
  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function longDate(d) { return DOW_LONG[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }
  function dayKey(d) { return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }

  /* ---------- Links & images ---------- */
  function safeUrl(u) {
    u = (u || "").trim();
    if (!u) return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    try { var p = new URL(u); return /^https?:$/.test(p.protocol) ? p.href : ""; } catch (e) { return ""; }
  }
  function imageUrl(u) {
    u = safeUrl(u);
    if (!u) return "";
    // Google Drive share links -> direct image
    var m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
    if (m) return "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1200";
    // Dropbox share links -> raw
    if (/dropbox\.com/.test(u)) return u.replace(/[?&]dl=0/, "").replace(/(\?|$)/, "?raw=1&").replace(/&$/, "");
    return u;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }
  function linkify(s) {
    return esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  /* ---------- Build events from rows ---------- */
  function buildEvents(rows) {
    var headerRow = -1;
    for (var r = 0; r < Math.min(rows.length, 10); r++) {
      var mm = mapHeaders(rows[r]);
      if (mm.title != null && mm.date != null) { headerRow = r; break; }
    }
    if (headerRow < 0) throw new Error("The sheet needs a “Title” column and a “Date” column in its header row.");
    var map = mapHeaders(rows[headerRow]);
    var get = function (row, k) { return map[k] != null && row[map[k]] != null ? row[map[k]].trim() : ""; };
    var out = [];
    rows.slice(headerRow + 1).forEach(function (row, i) {
      var title = get(row, "title");
      var date = parseDate(get(row, "date"));
      var show = get(row, "show").toLowerCase();
      if (!title || !date) return;
      if (show && /^(no|n|false|0|hide|hidden|draft)$/.test(show)) return;
      var endDate = parseDate(get(row, "endDate"));
      if (endDate && endDate < date) endDate = null;
      out.push({
        id: "e" + i,
        title: title,
        date: date,
        endDate: endDate,
        start: parseTime(get(row, "start")),
        end: parseTime(get(row, "end")),
        topic: get(row, "topic"),
        location: get(row, "location"),
        description: get(row, "description"),
        image: imageUrl(get(row, "image")),
        link: safeUrl(get(row, "link"))
      });
    });
    out.sort(function (a, b) { return a.date - b.date || (a.start == null ? -1 : a.start) - (b.start == null ? -1 : b.start); });
    return out;
  }

  function topicColor(t) {
    if (!t) return "#625B6E";
    var named = TOPIC_COLORS[t.trim().toLowerCase()];
    if (named) return named;
    var others = state.topics.filter(function (x) { return !TOPIC_COLORS[x.trim().toLowerCase()]; });
    return EXTRA[Math.max(0, others.indexOf(t)) % EXTRA.length];
  }
  function eventsOn(d) {
    return state.events.filter(function (ev) {
      if (state.active && ev.topic !== state.active) return false;
      if (ev.endDate) return d >= ev.date && d <= ev.endDate;
      return sameDay(ev.date, d);
    });
  }

  /* ---------- Rendering ---------- */
  var ICON = {
    date: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
    time: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    place: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
  };
  var MON3 = function (d) { return MONTHS[d.getMonth()].slice(0, 3); };

  function renderFilters() {
    var box = $("filters");
    if (state.topics.length < 2) { box.innerHTML = ""; return; }
    var html = '<button class="chip" data-topic="" aria-pressed="' + (!state.active) + '">All topics</button>';
    state.topics.forEach(function (t) {
      html += '<button class="chip" data-topic="' + esc(t) + '" aria-pressed="' + (state.active === t) + '" style="--c:' + topicColor(t) + '"><span class="sw"></span>' + esc(t) + '</button>';
    });
    box.innerHTML = html;
  }

  function render() {
    var y = state.year, m = state.month, today = new Date();
    $("mName").textContent = MONTHS[m];
    $("mYear").textContent = y;
    renderFilters();

    var first = new Date(y, m, 1);
    var start = new Date(y, m, 1 - first.getDay());
    var last = new Date(y, m + 1, 0);
    var cells = Math.ceil((first.getDay() + last.getDate()) / 7) * 7;

    var html = '<div class="grid" role="grid" aria-label="' + MONTHS[m] + " " + y + '">';
    DOW.forEach(function (d) { html += '<div class="dow" role="columnheader">' + d + "</div>"; });
    for (var i = 0; i < cells; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var evs = eventsOn(d);
      var key = dayKey(d);
      var cls = "day" + (d.getMonth() !== m ? " out" : "") + (sameDay(d, today) ? " today" : "") +
        (evs.length ? " has" : "") + (state.selected === key ? " sel" : "");
      html += '<div class="' + cls + '" role="gridcell" data-day="' + key + '"' +
        (evs.length ? ' tabindex="0" aria-label="' + esc(longDate(d) + ", " + evs.length + " event" + (evs.length > 1 ? "s" : "")) + '"' : "") +
        '><span class="num">' + d.getDate() + "</span>";
      evs.slice(0, 3).forEach(function (ev) {
        var t = ev.start != null && sameDay(ev.date, d) ? '<span class="t">' + fmtTime(ev.start, true) + "</span>" : "";
        html += '<button class="ev" data-id="' + ev.id + '" style="--c:' + topicColor(ev.topic) + '" title="' + esc(ev.title) + '"><span class="lc">' + t + esc(ev.title) + "</span></button>";
      });
      if (evs.length > 3) html += '<button class="more" data-day="' + key + '">+' + (evs.length - 3) + " more</button>";
      if (evs.length) {
        html += '<div class="dots" aria-hidden="true">';
        evs.slice(0, 4).forEach(function (ev) { html += '<span style="--c:' + topicColor(ev.topic) + '"></span>'; });
        html += "</div>";
      }
      html += "</div>";
    }
    $("view").innerHTML = html + "</div>";
    renderSide();
    try { history.replaceState(null, "", "#" + y + "-" + String(m + 1).padStart(2, "0")); } catch (e) {}
  }

  function renderSide() {
    var y = state.year, m = state.month, list, title, kicker;
    if (state.selected) {
      var p = state.selected.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);
      list = eventsOn(d);
      kicker = DOW_LONG[d.getDay()];
      title = MONTHS[d.getMonth()] + " " + d.getDate();
    } else {
      list = state.events.filter(function (ev) {
        if (state.active && ev.topic !== state.active) return false;
        return ev.date <= new Date(y, m + 1, 0) && (ev.endDate || ev.date) >= new Date(y, m, 1);
      });
      kicker = state.active || "All events";
      title = MONTHS[m] + " " + y;
    }
    $("sideKicker").textContent = kicker;
    $("sideTitle").textContent = title;
    $("sideReset").hidden = !state.selected;

    if (!list.length) {
      $("sideList").innerHTML = '<p class="side-empty">No events scheduled' + (state.selected ? " this day." : " this month. Use the arrows to browse other months.") + "</p>";
    } else {
      $("sideList").innerHTML = list.map(function (ev) {
        var when = ev.endDate ? "Through " + MON3(ev.endDate) + " " + ev.endDate.getDate() : timeRange(ev);
        var meta = [when, ev.location].filter(Boolean).map(esc).join("<br>");
        return '<button class="card" data-id="' + ev.id + '" data-daykey="' + dayKey(ev.date) + '" style="--c:' + topicColor(ev.topic) + '">' +
          '<div class="cd"><div class="mo">' + MON3(ev.date) + '</div><div class="dn">' + ev.date.getDate() + "</div></div>" +
          '<div><p class="card-title">' + esc(ev.title) + "</p>" +
          (meta ? '<p class="card-meta">' + meta + "</p>" : "") +
          (ev.topic && !state.active ? '<span class="card-topic">' + esc(ev.topic) + "</span>" : "") + "</div>" +
          (ev.image ? '<img class="thumb" src="' + esc(ev.image) + '" alt="" loading="lazy" onerror="this.remove()">' : "<span></span>") +
          "</button>";
      }).join("");
    }
    // keep the scrolling list below the header, whatever its height
    $("sideList").style.setProperty("--head-h", $("sideHead").offsetHeight + "px");
    $("sideList").style.top = $("sideHead").offsetHeight + "px";
    $("sideList").scrollTop = 0;
  }

  var lastClickY = null;
  function openEvent(id) {
    var ev = state.events.filter(function (e) { return e.id === id; })[0];
    if (!ev) return;
    var col = topicColor(ev.topic);
    var when = longDate(ev.date) + (ev.endDate ? " – " + longDate(ev.endDate) : "");
    var html = ev.image
      ? '<img class="dlg-img" src="' + esc(ev.image) + '" alt="" onerror="this.outerHTML=\'<div class=dlg-band></div>\'">'
      : '<div class="dlg-band"></div>';
    html += '<div class="dlg-body">';
    if (ev.topic) html += '<p class="dlg-topic">' + esc(ev.topic) + "</p>";
    html += '<h2 class="dlg-title" id="dlgTitle">' + esc(ev.title) + "</h2>";
    html += '<div class="facts"><div class="fact">' + ICON.date + "<span>" + esc(when) + "</span></div>";
    if (ev.start != null) html += '<div class="fact">' + ICON.time + "<span>" + esc(timeRange(ev)) + "</span></div>";
    if (ev.location) html += '<div class="fact">' + ICON.place + "<span>" + linkify(ev.location) + "</span></div>";
    html += "</div>";
    if (ev.description) html += '<p class="dlg-desc">' + linkify(ev.description) + "</p>";
    html += '<div class="dlg-actions">';
    if (ev.link) html += '<a class="btn-reg" href="' + esc(ev.link) + '" target="_blank" rel="noopener">Register</a>';
    html += '<button class="btn-ghost" id="ics">Add to my calendar</button></div></div>';
    var dlg = $("dlg");
    dlg.style.setProperty("--c", col);
    $("dlgContent").innerHTML = html;
    $("ics").onclick = function () { downloadICS(ev); };
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
    // Inside a tall iframe, keep the popup near where the viewer clicked.
    dlg.style.margin = "";
    if (lastClickY != null && window.innerHeight > 900) {
      var h = dlg.offsetHeight;
      var top = Math.max(12, Math.min(lastClickY - 80, window.innerHeight - h - 12));
      dlg.style.margin = top + "px auto auto";
    }
  }

  function downloadICS(ev) {
    var p = function (n) { return String(n).padStart(2, "0"); };
    var ymd = function (d) { return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()); };
    var dt = function (d, mins) { return ymd(d) + "T" + p(Math.floor(mins / 60)) + p(mins % 60) + "00"; };
    var escI = function (s) { return String(s || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;"); };
    var lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//BU-SHARP//Events//EN", "BEGIN:VEVENT",
      "UID:" + ev.id + "-" + ymd(ev.date) + "@busharp", "DTSTAMP:" + ymd(new Date()) + "T000000Z"];
    if (ev.start != null && !ev.endDate) {
      lines.push("DTSTART;TZID=America/New_York:" + dt(ev.date, ev.start));
      lines.push("DTEND;TZID=America/New_York:" + dt(ev.date, ev.end != null ? ev.end : ev.start + 60));
    } else {
      var e = new Date((ev.endDate || ev.date).getTime()); e.setDate(e.getDate() + 1);
      lines.push("DTSTART;VALUE=DATE:" + ymd(ev.date), "DTEND;VALUE=DATE:" + ymd(e));
    }
    lines.push("SUMMARY:" + escI(ev.title));
    var desc = ev.description + (ev.link ? "\n\nRegister: " + ev.link : "");
    if (desc.trim()) lines.push("DESCRIPTION:" + escI(desc.trim()));
    if (ev.location) lines.push("LOCATION:" + escI(ev.location));
    if (ev.link) lines.push("URL:" + ev.link);
    lines.push("END:VEVENT", "END:VCALENDAR");
    var blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = ev.title.replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").slice(0, 60) + ".ics";
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------- Interaction ---------- */
  function shift(n) {
    var d = new Date(state.year, state.month + n, 1);
    state.year = d.getFullYear(); state.month = d.getMonth(); state.selected = null; render();
  }
  function selectDay(key) {
    state.selected = state.selected === key ? null : key;
    render();
    if (state.selected && window.matchMedia("(max-width: 860px)").matches) {
      document.querySelector(".side").scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }
  $("prev").onclick = function () { shift(-1); };
  $("next").onclick = function () { shift(1); };
  $("today").onclick = function () { var t = new Date(); state.year = t.getFullYear(); state.month = t.getMonth(); state.selected = null; render(); };
  $("sideReset").onclick = function () { state.selected = null; render(); };
  $("dlgClose").onclick = function () { $("dlg").close(); };
  $("dlg").addEventListener("click", function (e) { if (e.target === this) this.close(); });
  $("filters").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    state.active = b.getAttribute("data-topic") || null; state.selected = null; render();
  });
  document.addEventListener("click", function (e) {
    lastClickY = e.clientY;
    if (e.target.closest("#dlg")) return;
    var t = e.target.closest("[data-id]");
    if (t) { openEvent(t.getAttribute("data-id")); return; }
    var day = e.target.closest(".more, .day.has");
    if (day) selectDay(day.getAttribute("data-day"));
  });
  document.addEventListener("keydown", function (e) {
    if ($("dlg").open) return;
    var day = e.target.closest && e.target.closest(".day.has");
    if (day && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); selectDay(day.getAttribute("data-day")); }
  });
  window.addEventListener("resize", function () { $("sideList").style.top = $("sideHead").offsetHeight + "px"; });

  /* ---------- Start ---------- */
  function sampleCSV() {
    var t = new Date(), y = t.getFullYear(), m = t.getMonth();
    var d = function (mo, day) { var x = new Date(y, m + mo, day); return x.getFullYear() + "-" + (x.getMonth() + 1) + "-" + x.getDate(); };
    return [
      "Title,Date,End Date,Start Time,End Time,Topic,Location,Description,Image URL,Registration Link",
      'Research Accelerator Meeting,' + d(0, 8) + ',,12:00 PM,1:00 PM,Research Accelerator Meetings,Zoom,"Sample event. Bring a draft aim, analysis plan, or figure for structured feedback from BU-SHARP faculty.",,https://www.bu.edu',
      '"Virtual ""Ask Anything"" Office Hours",' + d(0, 14) + ',,3:00 PM,4:00 PM,Office Hours,Zoom,"Sample event. Drop in with questions about data, methods, or grant plans.",,https://www.bu.edu',
      'Research Frontiers Seminar,' + d(0, 17) + ',,11:00 AM,12:00 PM,Research Frontiers,"715 Albany St, Boston",Sample event. A talk on new directions in population research on dementia.,,https://www.bu.edu',
      'Research Accelerator Meeting,' + d(0, 22) + ',,12:00 PM,1:00 PM,Research Accelerator Meetings,"715 Albany St, Boston",Sample event.,,https://www.bu.edu',
      'Data Hackathon,' + d(0, 27) + ',' + d(0, 28) + ',,,Hackathons,"Center for Computing & Data Sciences",Sample two-day event.,,https://www.bu.edu',
      '"Virtual ""Ask Anything"" Office Hours",' + d(1, 5) + ',,3:00 PM,4:00 PM,Office Hours,Zoom,Sample event.,,https://www.bu.edu'
    ].join("\n");
  }

  function init(text) {
    state.events = buildEvents(parseCSV(text));
    state.topics = [];
    state.events.forEach(function (ev) { if (ev.topic && state.topics.indexOf(ev.topic) < 0) state.topics.push(ev.topic); });
    // Filter buttons follow the order of the topics listed in SETTINGS
    var order = Object.keys(C.topics || {}).map(function (k) { return k.trim().toLowerCase(); });
    var rank = function (t) { var i = order.indexOf(t.trim().toLowerCase()); return i < 0 ? 99 : i; };
    state.topics.sort(function (a, b) { return rank(a) - rank(b); });
    var h = (location.hash || "").match(/^#(\d{4})-(\d{2})$/);
    var t = new Date();
    state.year = h ? +h[1] : t.getFullYear();
    state.month = h ? +h[2] - 1 : t.getMonth();
    render();
  }
  function fail(msg) {
    $("view").innerHTML = '<p class="status error">' + esc(msg) + "</p>";
    $("sideTitle").textContent = "Events unavailable";
  }

  if (!S.SHEET_CSV_URL) { init(sampleCSV()); return; }
  var url = S.SHEET_CSV_URL + (S.SHEET_CSV_URL.indexOf("?") > -1 ? "&" : "?") + "cachebust=" + Date.now();
  fetch(url, { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("status " + r.status); return r.text(); })
    .then(function (text) {
      if (/^\s*<(!doctype|html)/i.test(text)) throw new Error("html");
      try { init(text); } catch (e) { fail(e.message); }
    })
    .catch(function (e) {
      fail(e.message === "html"
        ? "Events can’t load: the sheet link isn’t a published CSV. In Google Sheets choose File › Share › Publish to web, pick the Events sheet and “Comma-separated values (.csv)”, and paste that link into SHEET_CSV_URL."
        : "Events can’t load right now. Check that the Google Sheet is still published to the web, then refresh this page.");
    });
})();
</script>
</body>
</html>
